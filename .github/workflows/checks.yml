name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest nbconvert ipykernel

      - name: Check the notebooks give the expected values
        run: python -m pytest tests -q

      - name: Execute the notebooks that need no downloaded data
        run: |
          for notebook in 03_junction_features 04_gtex_and_tcga \
                          05_sequencing_cost 06_detectability_model \
                          08_pathway_enrichment; do
            python -m nbconvert --to notebook --execute \
              --output /tmp/"$notebook".ipynb notebooks/"$notebook".ipynb
          done
